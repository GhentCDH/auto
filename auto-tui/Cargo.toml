[package]
name = "auto-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal UI client for the auto admin API"
authors = ["Miel Peeters <peetersmiel@gmail.com>"]

[dependencies]
ratatui = "0.30.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.52.3", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
reqwest = { version = "0.13.4", features = ["json", "query", "stream"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
dirs = "6.0.0"
color-eyre = "0.6"
base64 = "0.22"
rpassword = "7"
