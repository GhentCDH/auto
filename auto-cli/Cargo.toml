[package]
name = "auto-cli"
version.workspace = true
edition = "2024"
description = "Command line, TUI and MCP client for the auto admin API"
authors = ["Miel Peeters <peetersmiel@gmail.com>"]

[[bin]]
name = "auto"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.8", features = ["derive", "env"] }
rmcp = { version = "3.10.0", features = ["server", "transport-io"] }
ratatui = "0.30.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }
reqwest = { version = "0.13.4", features = ["json", "query", "stream"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
dirs = "7.0.0"
color-eyre = "0.6"
open = "5"
