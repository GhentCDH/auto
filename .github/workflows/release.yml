name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  generate-changelog:
    name: Generate changelog
    runs-on: ubuntu-22.04
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Generate a changelog
        uses: orhun/git-cliff-action@07dda386992489f0a6151dee53f3a137713644de # main
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --latest --no-exec --github-repo ${{ github.repository }}

  build-and-release:
    needs: generate-changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-global
          cache-to: type=gha,mode=max,scope=build-global

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ needs.generate-changelog.outputs.release_body }}

  # Prebuilt `auto` CLI binaries, attached to the release created above.
  # Both macOS targets build in one job: macOS runners are often scarce, so a
  # release should need only one of them.
  cli-binaries:
    name: CLI (${{ matrix.name }})
    needs: build-and-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            runner: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - name: linux arm64
            runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          - name: macos
            runner: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build and package
        run: |
          for target in ${{ matrix.targets }}; do
            rustup target add "$target"
            cargo build --release --locked -p auto-cli --target "$target"
            tar -czf "auto-$target.tar.gz" -C "target/$target/release" auto
            shasum -a 256 "auto-$target.tar.gz" > "auto-$target.tar.gz.sha256"
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            auto-*.tar.gz
            auto-*.tar.gz.sha256
